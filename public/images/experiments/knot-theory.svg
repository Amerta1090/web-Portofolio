<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="kt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" fill="#0f0f11" rx="12"/>
  <!-- Trefoil knot approximation using overlapping curves -->
  <!-- Top-left loop -->
  <path d="M30,75 C20,50 35,25 60,30 C80,34 85,55 70,65 C60,72 45,80 30,75Z" fill="none" stroke="url(#kt-grad)" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <!-- Crossing bridge (over) -->
  <path d="M55,42 C65,55 50,70 42,62" fill="none" stroke="url(#kt-grad)" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <!-- Under-crossing gap -->
  <path d="M70,65 C80,80 95,65 85,50" fill="none" stroke="url(#kt-grad)" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Second crossing -->
  <path d="M85,50 C90,35 75,25 60,30" fill="none" stroke="url(#kt-grad)" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Under-crossing highlight gap (background) -->
  <path d="M42,62 C38,58 44,50 52,46" fill="none" stroke="#0f0f11" stroke-width="4" stroke-linecap="round"/>
  <!-- Re-draw over strand -->
  <path d="M42,62 C38,58 44,50 52,46" fill="none" stroke="url(#kt-grad)" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <!-- Crossing dots -->
  <circle cx="52" cy="50" r="2" fill="#fff" opacity="0.6"/>
  <circle cx="65" cy="56" r="2" fill="#fff" opacity="0.6"/>
  <text x="60" y="110" text-anchor="middle" fill="#666" font-family="monospace" font-size="7">knot theory</text>
</svg>
