<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="mer-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="mer-glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="120" height="120" fill="#0f0f11" rx="12"/>
  <!-- rooms as connected boxes -->
  <g filter="url(#mer-glow)">
    <!-- Room 1: Algebra -->
    <rect x="10" y="15" width="28" height="22" rx="3" fill="#10b981" opacity="0.6" stroke="#10b981" stroke-width="1"/>
    <text x="24" y="29" text-anchor="middle" fill="#fff" font-family="monospace" font-size="6" font-weight="bold">x+3=7</text>
    <!-- Room 2: Geometry -->
    <rect x="48" y="10" width="28" height="22" rx="3" fill="#f59e0b" opacity="0.5" stroke="#f59e0b" stroke-width="1"/>
    <text x="62" y="24" text-anchor="middle" fill="#fff" font-family="monospace" font-size="5">△ area?</text>
    <!-- Room 3: Calculus -->
    <rect x="82" y="20" width="28" height="22" rx="3" fill="#8b5cf6" opacity="0.5" stroke="#8b5cf6" stroke-width="1"/>
    <text x="96" y="34" text-anchor="middle" fill="#fff" font-family="monospace" font-size="6">∫ dx</text>
    <!-- Room 4: Number Theory -->
    <rect x="20" y="55" width="28" height="22" rx="3" fill="#ef4444" opacity="0.5" stroke="#ef4444" stroke-width="1"/>
    <text x="34" y="69" text-anchor="middle" fill="#fff" font-family="monospace" font-size="5">p₁₃?</text>
    <!-- Room 5: Probability -->
    <rect x="65" y="60" width="28" height="22" rx="3" fill="#06b6d4" opacity="0.5" stroke="#06b6d4" stroke-width="1"/>
    <text x="79" y="74" text-anchor="middle" fill="#fff" font-family="monospace" font-size="5">P(A)?</text>
  </g>
  <!-- corridors -->
  <g stroke="#4b5563" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.5">
    <line x1="38" y1="26" x2="48" y2="21"/>
    <line x1="76" y1="21" x2="82" y2="31"/>
    <line x1="24" y1="37" x2="34" y2="55"/>
    <line x1="62" y1="32" x2="79" y2="60"/>
    <line x1="48" y1="66" x2="65" y2="71"/>
  </g>
  <!-- key icon -->
  <g transform="translate(90,90)" filter="url(#mer-glow)">
    <circle cx="0" cy="0" r="5" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="5" y1="0" x2="12" y2="0" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="10" y1="0" x2="10" y2="3" stroke="#f59e0b" stroke-width="1"/>
  </g>
  <text x="60" y="110" text-anchor="middle" fill="#a1a1aa" font-family="monospace" font-size="7">ESCAPE ROOM</text>
</svg>
