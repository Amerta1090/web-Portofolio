<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="rm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" fill="#0f0f11" rx="12"/>
  <!-- Matrix grid (6x6 of small squares) -->
  <g opacity="0.25" stroke="url(#rm-grad)" stroke-width="0.5" fill="none">
    <rect x="18" y="18" width="12" height="12" rx="1"/>
    <rect x="32" y="18" width="12" height="12" rx="1"/>
    <rect x="46" y="18" width="12" height="12" rx="1"/>
    <rect x="60" y="18" width="12" height="12" rx="1"/>
    <rect x="74" y="18" width="12" height="12" rx="1"/>
    <rect x="88" y="18" width="12" height="12" rx="1"/>
    <rect x="18" y="32" width="12" height="12" rx="1"/>
    <rect x="32" y="32" width="12" height="12" rx="1"/>
    <rect x="46" y="32" width="12" height="12" rx="1"/>
    <rect x="60" y="32" width="12" height="12" rx="1"/>
    <rect x="74" y="32" width="12" height="12" rx="1"/>
    <rect x="88" y="32" width="12" height="12" rx="1"/>
    <rect x="18" y="46" width="12" height="12" rx="1"/>
    <rect x="32" y="46" width="12" height="12" rx="1"/>
    <rect x="46" y="46" width="12" height="12" rx="1"/>
    <rect x="60" y="46" width="12" height="12" rx="1"/>
    <rect x="74" y="46" width="12" height="12" rx="1"/>
    <rect x="88" y="46" width="12" height="12" rx="1"/>
    <rect x="18" y="60" width="12" height="12" rx="1"/>
    <rect x="32" y="60" width="12" height="12" rx="1"/>
    <rect x="46" y="60" width="12" height="12" rx="1"/>
    <rect x="60" y="60" width="12" height="12" rx="1"/>
    <rect x="74" y="60" width="12" height="12" rx="1"/>
    <rect x="88" y="60" width="12" height="12" rx="1"/>
  </g>
  <!-- Eigenvalue scatter dots (unit circle hint) -->
  <circle cx="60" cy="50" r="22" fill="none" stroke="url(#rm-grad)" stroke-width="0.6" opacity="0.2" stroke-dasharray="3,2"/>
  <!-- Scatter dots with varying opacity -->
  <circle cx="55" cy="32" r="2" fill="url(#rm-grad)" opacity="0.9"/>
  <circle cx="72" cy="38" r="2" fill="url(#rm-grad)" opacity="0.8"/>
  <circle cx="42" cy="44" r="2" fill="url(#rm-grad)" opacity="0.7"/>
  <circle cx="68" cy="55" r="2.5" fill="url(#rm-grad)"/>
  <circle cx="50" cy="60" r="2" fill="url(#rm-grad)" opacity="0.8"/>
  <circle cx="78" cy="48" r="2" fill="url(#rm-grad)" opacity="0.6"/>
  <circle cx="48" cy="36" r="2" fill="url(#rm-grad)" opacity="0.7"/>
  <circle cx="64" cy="62" r="2" fill="url(#rm-grad)" opacity="0.9"/>
  <circle cx="56" cy="48" r="3" fill="url(#rm-grad)"/>
  <circle cx="38" cy="52" r="2" fill="url(#rm-grad)" opacity="0.5"/>
  <circle cx="80" cy="44" r="2" fill="url(#rm-grad)" opacity="0.6"/>
  <circle cx="60" cy="56" r="2.5" fill="url(#rm-grad)" opacity="0.85"/>
  <!-- Glow on center -->
  <circle cx="60" cy="50" r="6" fill="url(#rm-grad)" opacity="0.08"/>
  <text x="60" y="110" text-anchor="middle" fill="#666" font-family="monospace" font-size="7">random matrix</text>
</svg>
