<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="qc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" fill="#0f0f11" rx="12"/>
  <!-- Qubit wires -->
  <line x1="10" y1="36" x2="110" y2="36" stroke="url(#qc-grad)" stroke-width="1" opacity="0.3"/>
  <line x1="10" y1="60" x2="110" y2="60" stroke="url(#qc-grad)" stroke-width="1" opacity="0.3"/>
  <line x1="10" y1="84" x2="110" y2="84" stroke="url(#qc-grad)" stroke-width="1" opacity="0.3"/>
  <!-- H gate -->
  <rect x="22" y="28" width="16" height="16" rx="2" fill="none" stroke="url(#qc-grad)" stroke-width="1.2"/>
  <text x="30" y="40" text-anchor="middle" fill="url(#qc-grad)" font-family="monospace" font-size="10" font-weight="bold">H</text>
  <!-- CNOT gate (control) -->
  <circle cx="52" cy="36" r="3" fill="url(#qc-grad)"/>
  <line x1="52" y1="36" x2="52" y2="60" stroke="url(#qc-grad)" stroke-width="1"/>
  <!-- CNOT gate (target) -->
  <circle cx="52" cy="60" r="7" fill="none" stroke="url(#qc-grad)" stroke-width="1.2"/>
  <line x1="45" y1="60" x2="59" y2="60" stroke="url(#qc-grad)" stroke-width="1.2"/>
  <line x1="52" y1="53" x2="52" y2="67" stroke="url(#qc-grad)" stroke-width="1.2"/>
  <!-- T gate -->
  <rect x="72" y="52" width="16" height="16" rx="2" fill="none" stroke="url(#qc-grad)" stroke-width="1.2"/>
  <text x="80" y="64" text-anchor="middle" fill="url(#qc-grad)" font-family="monospace" font-size="10" font-weight="bold">T</text>
  <!-- Measurement -->
  <rect x="88" y="76" width="18" height="16" rx="2" fill="none" stroke="url(#qc-grad)" stroke-width="1"/>
  <path d="M92,88 A6,6 0 0,1 102,88" fill="none" stroke="url(#qc-grad)" stroke-width="1"/>
  <line x1="97" y1="88" x2="97" y2="82" stroke="url(#qc-grad)" stroke-width="1"/>
  <!-- Glow -->
  <rect x="20" y="24" width="14" height="24" rx="3" fill="url(#qc-grad)" opacity="0.06"/>
  <text x="60" y="110" text-anchor="middle" fill="#666" font-family="monospace" font-size="7">quantum circuit</text>
</svg>
