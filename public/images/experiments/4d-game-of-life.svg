<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="4dgol-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="4dgol-glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="120" height="120" fill="#0f0f11" rx="12"/>
  <!-- 4D hypercube wireframe - front face -->
  <g filter="url(#4dgol-glow)" opacity="0.7">
    <rect x="25" y="25" width="40" height="40" fill="none" stroke="url(#4dgol-grad)" stroke-width="1.5"/>
    <!-- back face (offset) -->
    <rect x="40" y="40" width="40" height="40" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
    <!-- connecting edges -->
    <line x1="25" y1="25" x2="40" y2="40" stroke="#f59e0b" stroke-width="0.8" opacity="0.4"/>
    <line x1="65" y1="25" x2="80" y2="40" stroke="#f59e0b" stroke-width="0.8" opacity="0.4"/>
    <line x1="25" y1="65" x2="40" y2="80" stroke="#f59e0b" stroke-width="0.8" opacity="0.4"/>
    <line x1="65" y1="65" x2="80" y2="80" stroke="#f59e0b" stroke-width="0.8" opacity="0.4"/>
  </g>
  <!-- alive cells -->
  <g filter="url(#4dgol-glow)">
    <rect x="30" y="30" width="8" height="8" fill="#f59e0b" rx="1"/>
    <rect x="46" y="38" width="8" height="8" fill="#ef4444" rx="1"/>
    <rect x="38" y="54" width="8" height="8" fill="#f59e0b" rx="1"/>
    <rect x="54" y="54" width="8" height="8" fill="#fbbf24" rx="1"/>
    <rect x="62" y="46" width="8" height="8" fill="#ef4444" rx="1"/>
    <rect x="46" y="62" width="8" height="8" fill="#f59e0b" rx="1"/>
  </g>
  <!-- label -->
  <text x="60" y="110" text-anchor="middle" fill="#a1a1aa" font-family="monospace" font-size="7">4D LIFE</text>
</svg>
