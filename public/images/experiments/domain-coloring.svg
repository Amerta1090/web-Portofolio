<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <radialGradient id="dc-hue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff0040"/>
      <stop offset="17%" stop-color="#ff8800"/>
      <stop offset="33%" stop-color="#ffee00"/>
      <stop offset="50%" stop-color="#00dd44"/>
      <stop offset="67%" stop-color="#00bbff"/>
      <stop offset="83%" stop-color="#7700ff"/>
      <stop offset="100%" stop-color="#ff0040"/>
    </radialGradient>
    <radialGradient id="dc-zero" cx="50%" cy="50%" r="5%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dc-pole" cx="45%" cy="52%" r="12%">
      <stop offset="0%" stop-color="#0f0f11" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f0f11" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="#0f0f11"/>
  <ellipse cx="200" cy="150" rx="130" ry="130" fill="url(#dc-hue)" opacity="0.7"/>
  <ellipse cx="200" cy="150" rx="130" ry="130" fill="none" stroke="#222" stroke-width="0.5"/>
  <!-- Iso-magnitude rings -->
  <circle cx="200" cy="150" r="32" fill="none" stroke="#fff" stroke-width="0.3" opacity="0.3"/>
  <circle cx="200" cy="150" r="65" fill="none" stroke="#fff" stroke-width="0.3" opacity="0.25"/>
  <circle cx="200" cy="150" r="97" fill="none" stroke="#fff" stroke-width="0.3" opacity="0.2"/>
  <circle cx="200" cy="150" r="130" fill="none" stroke="#fff" stroke-width="0.3" opacity="0.15"/>
  <!-- Zero point -->
  <circle cx="200" cy="150" r="6" fill="url(#dc-zero)"/>
  <circle cx="200" cy="150" r="2" fill="#fff"/>
  <!-- Pole region -->
  <ellipse cx="180" cy="160" rx="18" ry="18" fill="url(#dc-pole)"/>
  <text x="200" y="292" text-anchor="middle" fill="#555" font-family="monospace" font-size="8">f(z) = z²</text>
</svg>