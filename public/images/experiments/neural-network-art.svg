<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="nn-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="nn-glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="120" height="120" fill="#0f0f11" rx="12"/>
  <!-- connections -->
  <g opacity="0.3" stroke="url(#nn-grad)" stroke-width="0.8">
    <line x1="25" y1="40" x2="55" y2="25"/><line x1="25" y1="40" x2="55" y2="45"/>
    <line x1="25" y1="40" x2="55" y2="65"/><line x1="25" y1="40" x2="55" y2="85"/>
    <line x1="25" y1="80" x2="55" y2="25"/><line x1="25" y1="80" x2="55" y2="45"/>
    <line x1="25" y1="80" x2="55" y2="65"/><line x1="25" y1="80" x2="55" y2="85"/>
    <line x1="55" y1="25" x2="95" y2="60"/><line x1="55" y1="45" x2="95" y2="60"/>
    <line x1="55" y1="65" x2="95" y2="60"/><line x1="55" y1="85" x2="95" y2="60"/>
  </g>
  <!-- input neurons -->
  <circle cx="25" cy="40" r="6" fill="#3b82f6" filter="url(#nn-glow)"/>
  <circle cx="25" cy="80" r="6" fill="#06b6d4" filter="url(#nn-glow)"/>
  <!-- hidden neurons -->
  <circle cx="55" cy="25" r="5" fill="#8b5cf6" filter="url(#nn-glow)"/>
  <circle cx="55" cy="45" r="5" fill="#a78bfa" filter="url(#nn-glow)"/>
  <circle cx="55" cy="65" r="5" fill="#7c3aed" filter="url(#nn-glow)"/>
  <circle cx="55" cy="85" r="5" fill="#c084fc" filter="url(#nn-glow)"/>
  <!-- output neuron -->
  <circle cx="95" cy="60" r="7" fill="#f59e0b" filter="url(#nn-glow)"/>
  <!-- activation particles -->
  <circle cx="40" cy="32" r="2" fill="#f59e0b" opacity="0.8"/>
  <circle cx="75" cy="52" r="2" fill="#f59e0b" opacity="0.6"/>
  <circle cx="42" cy="62" r="1.5" fill="#06b6d4" opacity="0.7"/>
  <text x="60" y="110" text-anchor="middle" fill="#a1a1aa" font-family="monospace" font-size="7">NEURAL ART</text>
</svg>
