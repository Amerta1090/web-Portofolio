<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#0f0f11"/>
  <g transform="translate(55,95)">
    <text x="10" y="-10" fill="#f59e0b" font-size="10" font-family="monospace" opacity="0.6">A</text>
    <rect x="0" y="0" width="90" height="60" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.3"/>
    <rect x="0" y="0" width="30" height="60" fill="#f59e0b" opacity="0.15"/>
    <text x="12" y="22" fill="#f59e0b" font-size="8" font-family="monospace">1</text>
    <text x="42" y="22" fill="#fff" font-size="8" font-family="monospace" opacity="0.4">2</text>
    <text x="72" y="22" fill="#fff" font-size="8" font-family="monospace" opacity="0.4">3</text>
    <text x="12" y="42" fill="#fff" font-size="8" font-family="monospace" opacity="0.4">4</text>
    <text x="42" y="42" fill="#fff" font-size="8" font-family="monospace" opacity="0.4">5</text>
    <text x="72" y="42" fill="#fff" font-size="8" font-family="monospace" opacity="0.4">6</text>
    <line x1="10" y1="14" x2="80" y2="14" stroke="#f59e0b" stroke-width="0.5" opacity="0.2"/>
    <line x1="10" y1="48" x2="80" y2="48" stroke="#f59e0b" stroke-width="0.5" opacity="0.2"/>
  </g>
  <g transform="translate(175,95)">
    <text x="10" y="-10" fill="#06b6d4" font-size="10" font-family="monospace" opacity="0.6">B</text>
    <rect x="0" y="0" width="60" height="90" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.3"/>
    <rect x="0" y="0" width="60" height="30" fill="#06b6d4" opacity="0.15"/>
    <text x="12" y="20" fill="#06b6d4" font-size="8" font-family="monospace">7</text>
    <text x="32" y="20" fill="#fff" font-size="8" font-family="monospace" opacity="0.4">8</text>
    <text x="12" y="40" fill="#fff" font-size="8" font-family="monospace" opacity="0.4">9</text>
    <text x="32" y="40" fill="#fff" font-size="8" font-family="monospace" opacity="0.4">0</text>
    <text x="12" y="60" fill="#fff" font-size="8" font-family="monospace" opacity="0.4">1</text>
    <text x="32" y="60" fill="#fff" font-size="8" font-family="monospace" opacity="0.4">2</text>
  </g>
  <g transform="translate(290,110)">
    <text x="10" y="-10" fill="#10b981" font-size="10" font-family="monospace" opacity="0.6">C</text>
    <rect x="0" y="0" width="50" height="30" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.5"/>
    <rect x="0" y="0" width="50" height="30" fill="#10b981" opacity="0.1"/>
    <text x="8" y="20" fill="#10b981" font-size="10" font-family="monospace" font-weight="bold">19</text>
    <text x="30" y="20" fill="#10b981" font-size="10" font-family="monospace" font-weight="bold">22</text>
  </g>
  <line x1="145" y1="120" x2="175" y2="105" stroke="#f59e0b" stroke-width="1" opacity="0.4"/>
  <line x1="145" y1="150" x2="175" y2="120" stroke="#06b6d4" stroke-width="1" opacity="0.4"/>
  <line x1="235" y1="140" x2="290" y2="125" stroke="#10b981" stroke-width="1" opacity="0.4"/>
  <line x1="235" y1="155" x2="290" y2="125" stroke="#10b981" stroke-width="1" opacity="0.4"/>
  <g transform="translate(100,220)">
    <rect x="0" y="0" width="200" height="50" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.2" rx="4"/>
    <line x1="50" y1="5" x2="50" y2="45" stroke="#f59e0b" stroke-width="0.5" opacity="0.2"/>
    <line x1="100" y1="5" x2="100" y2="45" stroke="#f59e0b" stroke-width="0.5" opacity="0.2"/>
    <line x1="150" y1="5" x2="150" y2="45" stroke="#f59e0b" stroke-width="0.5" opacity="0.2"/>
    <text x="25" y="28" fill="#f59e0b" font-size="9" font-family="monospace">1·7+2·9</text>
    <text x="75" y="28" fill="#06b6d4" font-size="9" font-family="monospace">1·8+2·0</text>
    <text x="125" y="28" fill="#10b981" font-size="9" font-family="monospace">1·1+2·2</text>
  </g>
  <text x="200" y="285" fill="#f59e0b" font-size="10" text-anchor="middle" font-family="monospace" opacity="0.4">A × B = C  (dot product)</text>
